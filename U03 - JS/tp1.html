<!DOCTYPE html>
<html>
<head>
  <title>Palabras</title>
</head>
<body>
  <h1>Ingresá 5 palabras</h1>
  <script>
    const palabras = [];

    for (let i = 0; i < 5; i++) {
      const palabra = prompt(`Ingresa la palabra ${i + 1}:`);
      palabras.push(palabra);
    }

    console.log(palabras);
  </script>
</body>
</html>
